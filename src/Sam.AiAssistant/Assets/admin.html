<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت دستیار هوشمند</title>
<style>
:root {
  --bg:#f3f5fb; --surface:#fff; --surface-2:#f8f9fe; --border:#e3e7f3; --border-strong:#cfd6ea;
  --text:#18204a; --muted:#6a7399; --brand:#4f6df5; --brand-2:#7c5cf6; --brand-soft:rgba(79,109,245,.1);
  --ok:#17a673; --ok-soft:rgba(23,166,115,.12); --warn:#e5930a; --warn-soft:rgba(229,147,10,.14);
  --danger:#e5484d; --danger-soft:rgba(229,72,77,.1);
  --shadow:0 1px 2px rgba(24,32,74,.05),0 8px 24px -12px rgba(24,32,74,.15);
  --radius:14px; --side:250px;
  --code-bg:#0e1430; --code-fg:#dfe6ff;
}
:root[data-theme=dark] {
  --bg:#0c1022; --surface:#141a35; --surface-2:#1a2142; --border:#252d52; --border-strong:#34406d;
  --text:#e8ecff; --muted:#93a0cf; --brand:#7b93ff; --brand-2:#a68bff; --brand-soft:rgba(123,147,255,.14);
  --ok:#3ddba0; --ok-soft:rgba(61,219,160,.12); --warn:#ffb648; --warn-soft:rgba(255,182,72,.14);
  --danger:#ff6b70; --danger-soft:rgba(255,107,112,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);
  --code-bg:#080c1d;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); line-height:1.75; font-size:14px; }
button,input,select,textarea { font:inherit; color:inherit; }
::selection { background:var(--brand-soft); }
::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:10px; border:2px solid transparent; background-clip:content-box; }

/* layout */
.app { display:grid; grid-template-columns:var(--side) 1fr; min-height:100vh; }
.side { position:sticky; top:0; height:100vh; background:var(--surface); border-inline-end:1px solid var(--border); display:flex; flex-direction:column; padding:18px 14px; gap:6px; z-index:30; }
.brand { display:flex; align-items:center; gap:10px; padding:4px 8px 18px; font-weight:800; font-size:16px; }
.brand .logo { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand-2)); box-shadow:0 8px 18px -8px var(--brand); }
.brand small { display:block; font-weight:500; color:var(--muted); font-size:11px; margin-top:-4px; }
.nav a { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:var(--muted); text-decoration:none; font-weight:600; cursor:pointer; transition:.15s; }
.nav a:hover { background:var(--surface-2); color:var(--text); }
.nav a.active { background:var(--brand-soft); color:var(--brand); }
.nav a .count { margin-inline-start:auto; font-size:11px; background:var(--surface-2); border:1px solid var(--border); padding:0 8px; border-radius:99px; color:var(--muted); }
.side .foot { margin-top:auto; display:flex; gap:8px; }
.main { min-width:0; }
.top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 28px; background:color-mix(in srgb,var(--bg) 85%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
.top h1 { font-size:19px; margin:0; font-weight:800; }
.top .sub { color:var(--muted); font-size:12.5px; }
.top .spacer { flex:1; }
.menu-btn { display:none; }
.content { padding:24px 28px 90px; max-width:1280px; }

/* primitives */
.btn { display:inline-flex; align-items:center; gap:7px; border:1px solid transparent; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; padding:8px 16px; border-radius:11px; cursor:pointer; font-weight:700; transition:.15s; white-space:nowrap; }
.btn:hover { filter:brightness(1.07); transform:translateY(-1px); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn.ghost { background:var(--surface); color:var(--text); border-color:var(--border-strong); }
.btn.soft { background:var(--brand-soft); color:var(--brand); }
.btn.danger { background:var(--danger); }
.btn.sm { padding:4px 11px; font-size:12.5px; border-radius:9px; }
.icon-btn { width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--border); background:var(--surface); border-radius:10px; cursor:pointer; color:var(--muted); }
.icon-btn:hover { color:var(--text); border-color:var(--border-strong); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
.pad { padding:18px; }
.grid { display:grid; gap:16px; }
.g4 { grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); }
.g2 { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
.toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
.search { position:relative; flex:1; min-width:200px; }
.search svg { position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
.search input { padding-inline-start:38px; }
input[type=text],input[type=search],input[type=number],input:not([type]),select,textarea { width:100%; background:var(--surface); border:1px solid var(--border-strong); border-radius:11px; padding:9px 12px; outline:none; transition:.15s; }
input:focus,select:focus,textarea:focus { border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
textarea { resize:vertical; min-height:80px; }
.ltr { direction:ltr; text-align:left; font-family:Consolas,"Cascadia Mono",monospace; font-size:13px; }
label.lbl { display:block; font-weight:700; font-size:12.5px; margin:14px 0 5px; }
.hint { color:var(--muted); font-size:12px; margin-top:4px; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:2px 11px; border-radius:99px; font-size:12px; font-weight:700; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); cursor:default; }
.chip.btnlike { cursor:pointer; } .chip.btnlike:hover { border-color:var(--brand); color:var(--brand); }
.chip.on { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); }
.chip.ok { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
.chip.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.chip.err { background:var(--danger-soft); color:var(--danger); border-color:transparent; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.switch { position:relative; display:inline-block; vertical-align:middle; width:42px; height:24px; flex:none; }
.switch input { opacity:0; width:0; height:0; position:absolute; }
.switch span { position:absolute; inset:0; background:var(--border-strong); border-radius:99px; cursor:pointer; transition:.2s; }
.switch span::after { content:""; position:absolute; top:3px; inset-inline-start:3px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + span { background:var(--ok); }
.switch input:checked + span::after { inset-inline-start:21px; }
.row { display:flex; align-items:center; gap:10px; }
.muted { color:var(--muted); }
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty svg { opacity:.5; margin-bottom:8px; }

/* stat cards */
.stat { padding:18px; display:flex; gap:14px; align-items:center; }
.stat .ico { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand); flex:none; }
.stat .num { font-size:26px; font-weight:800; line-height:1.1; }
.stat .cap { color:var(--muted); font-size:12.5px; }

/* table */
.tbl { width:100%; border-collapse:separate; border-spacing:0; }
.tbl th { text-align:right; font-size:12px; color:var(--muted); font-weight:700; padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--border); }
.tbl td { padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
.tbl tr:last-child td { border-bottom:0; }
.tbl tbody tr:hover td { background:var(--surface-2); }
.tbl tr.off td { opacity:.55; }
.tbl .q { font-weight:700; } .tbl .a { color:var(--muted); font-size:13px; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tbl-wrap { overflow:auto; border-radius:var(--radius); }

/* section cards */
.sec { padding:18px; display:flex; flex-direction:column; gap:10px; transition:.15s; }
.sec:hover { border-color:var(--brand); }
.sec.off { opacity:.55; }
.sec h3 { margin:0; font-size:15px; }
pre.code { margin:0; background:var(--code-bg); color:var(--code-fg); padding:12px 14px; border-radius:11px; overflow:auto; max-height:150px; direction:ltr; text-align:left; font-size:12.5px; font-family:Consolas,"Cascadia Mono",monospace; white-space:pre-wrap; }
pre.code.big { max-height:520px; font-size:13px; }
.tok-k { color:#8fb0ff; font-weight:700; } .tok-p { color:#ffc56d; } .tok-s { color:#8be3b0; } .tok-n { color:#ff9ec1; } .tok-f { color:#c9a6ff; }

/* editor with highlight */
.sqled { position:relative; background:var(--code-bg); border-radius:12px; border:1px solid var(--border-strong); overflow:hidden; direction:ltr; }
.sqled pre, .sqled textarea { margin:0; padding:14px 14px 14px 52px; font-family:Consolas,"Cascadia Mono",monospace; font-size:13px; line-height:1.65; white-space:pre; tab-size:2; }
.sqled pre { position:absolute; inset:0; overflow:hidden; color:var(--code-fg); pointer-events:none; }
.sqled .gutter { position:absolute; top:0; left:0; bottom:0; width:40px; padding:14px 6px 14px 0; text-align:right; color:#5d6aa0; font:12px/1.65 Consolas,monospace; overflow:hidden; border-right:1px solid #1d2650; background:rgba(255,255,255,.02); user-select:none; white-space:pre; }
.sqled textarea { position:relative; display:block; width:100%; min-height:240px; background:transparent; color:transparent; caret-color:#fff; border:0; box-shadow:none; resize:vertical; overflow:auto; border-radius:0; text-align:left; }
.sqled textarea:focus { box-shadow:none; }

/* drawer / modal */
.overlay { position:fixed; inset:0; background:rgba(8,12,34,.55); backdrop-filter:blur(3px); z-index:60; animation:fade .2s; }
.drawer { position:fixed; top:0; bottom:0; inset-inline-end:0; width:min(680px,100vw); background:var(--surface); z-index:61; display:flex; flex-direction:column; box-shadow:-20px 0 50px rgba(0,0,0,.3); animation:slide .25s ease; }
.drawer header { display:flex; align-items:center; gap:10px; padding:16px 22px; border-bottom:1px solid var(--border); }
.drawer header h2 { margin:0; font-size:17px; flex:1; }
.drawer .body { flex:1; overflow:auto; padding:6px 22px 22px; }
.drawer footer { display:flex; gap:10px; padding:14px 22px; border-top:1px solid var(--border); background:var(--surface-2); }
.modal { position:fixed; z-index:71; top:50%; left:50%; transform:translate(-50%,-50%); width:min(430px,92vw); padding:24px; animation:pop .2s; }
@keyframes fade { from{opacity:0} } @keyframes slide { from{transform:translateX(-40px);opacity:0} } @keyframes pop { from{transform:translate(-50%,-46%);opacity:0} }
.two { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; } @media (max-width:640px) { .two { grid-template-columns:1fr; } }

/* settings */
.set-nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.field { padding:16px 18px; display:block; }
.field .top2 { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.field .top2 b { font-size:13.5px; } .field .top2 code { color:var(--muted); font-size:11.5px; direction:ltr; }
.field.dirty { border-color:var(--warn); box-shadow:0 0 0 3px var(--warn-soft); }
.savebar { position:fixed; bottom:18px; inset-inline-start:50%; transform:translateX(50%); z-index:40; display:flex; align-items:center; gap:14px; padding:10px 14px 10px 18px; border-radius:16px; background:var(--text); color:var(--bg); box-shadow:0 18px 40px -10px rgba(0,0,0,.5); animation:pop2 .25s; }
@keyframes pop2 { from{opacity:0;transform:translate(50%,14px)} }
.savebar .btn { background:var(--brand); }

/* preview */
.meter { height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden; border:1px solid var(--border); }
.meter i { display:block; height:100%; background:linear-gradient(90deg,var(--ok),var(--brand)); border-radius:99px; transition:.4s; }

/* logs */
.log { padding:14px 18px; border-bottom:1px solid var(--border); cursor:pointer; }
.log:last-child { border-bottom:0; } .log:hover { background:var(--surface-2); }
.log .head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.log .q { font-weight:700; flex:1; min-width:200px; }
.log .detail { margin-top:10px; display:none; white-space:pre-wrap; background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:12px; }
.log.open .detail { display:block; }
.spark { display:flex; align-items:flex-end; gap:3px; height:64px; }
.spark i { flex:1; background:var(--brand); border-radius:3px 3px 0 0; min-height:3px; opacity:.85; }
.spark i.e { background:var(--danger); }

/* toast */
#toasts { position:fixed; bottom:20px; inset-inline-start:20px; z-index:90; display:flex; flex-direction:column; gap:8px; }
.toast { background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; box-shadow:0 12px 30px -8px rgba(0,0,0,.4); animation:pop2b .25s; font-weight:600; display:flex; gap:10px; align-items:center; }
.toast.err { background:var(--danger); color:#fff; } .toast.ok { background:var(--ok); color:#fff; }
@keyframes pop2b { from{opacity:0;transform:translateY(10px)} }
.skeleton { height:90px; border-radius:var(--radius); background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface)); background-size:200% 100%; animation:sk 1.2s infinite; margin-bottom:12px; }
@keyframes sk { to{background-position:-200% 0} }

@media (max-width:900px) {
  .app { grid-template-columns:1fr; }
  .side { position:fixed; inset-block:0; inset-inline-start:0; width:260px; transform:translateX(100%); transition:.25s; box-shadow:-20px 0 50px rgba(0,0,0,.3); }
  .side.open { transform:none; }
  .menu-btn { display:grid; } .content { padding:18px 14px 90px; } .top { padding:12px 14px; }
}
</style>
<!--AI-ADMIN-HEAD-->
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo" id="logo"></div><div>دستیار هوشمند<small>پنل مدیریت</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button class="icon-btn" id="themeBtn" title="تغییر تم"></button>
      <button class="icon-btn" id="helpBtn" title="میان‌بُرها">?</button>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="منو"></button>
      <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <div id="topActions" class="row"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
(function () {
'use strict';
var API = 'api/admin/';

/* ---------- ابزارها ---------- */
function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  });
  [].concat(kids || []).forEach(function (c) { if (c != null && c !== false) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function fa(n) { return String(n).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
function ico(name, size) {
  var p = {
    dash: '<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
    qa: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 10a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5M12 16.5h.01"/>',
    db: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
    cog: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    log: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>', menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
    play: '<path d="m6 4 14 8-14 8z"/>', copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
    dl: '<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>', ul: '<path d="M12 21V9m0 0-4 4m4-4 4 4M4 3h16"/>',
    bolt: '<path d="M13 2 3 14h8l-1 8 10-12h-8z"/>', check: '<path d="m4 12 5 5L20 6"/>', alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
    bot: '<rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4M9 14h.01M15 14h.01"/><circle cx="12" cy="3" r="1"/>'
  }[name] || '';
  return '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
}
function I(name, size) { var s = document.createElement('span'); s.style.display = 'inline-flex'; s.innerHTML = ico(name, size); return s; }
function safe(fn) { try { return fn(); } catch (e) { return null; } }

function toast(msg, type) {
  var t = h('div', { class: 'toast ' + (type || '') }, [msg]);
  document.getElementById('toasts').appendChild(t);
  setTimeout(function () { t.style.opacity = 0; t.style.transition = '.3s'; setTimeout(function () { t.remove(); }, 300); }, 3200);
}

async function call(path, method, body) {
  var res = await fetch(API + path, {
    method: method || 'GET', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (res.status === 204) return null;
  var data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || ('خطا ' + res.status));
  return data;
}

function confirmBox(title, text, okLabel) {
  return new Promise(function (resolve) {
    var ov = h('div', { class: 'overlay', style: 'z-index:70' });
    var done = function (v) { ov.remove(); box.remove(); resolve(v); };

var SQL_KW = 'SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|CROSS|ON|GROUP|BY|ORDER|HAVING|TOP|DISTINCT|WITH|UNION|ALL|CASE|WHEN|THEN|ELSE|END|LIKE|BETWEEN|EXISTS|ASC|DESC|OVER|PARTITION|OFFSET|FETCH|NEXT|ROWS|ONLY';
var SQL_FN = 'COUNT|SUM|AVG|MIN|MAX|ISNULL|COALESCE|CAST|CONVERT|DATEADD|DATEDIFF|GETDATE|SYSDATETIME|LEN|LTRIM|RTRIM|UPPER|LOWER|SUBSTRING|REPLACE|FORMAT|ROW_NUMBER|YEAR|MONTH|DAY';
var SQL_RE = new RegExp("('(?:[^']|'')*')|(@\\w+)|\\b(" + SQL_KW + ")\\b|\\b(" + SQL_FN + ")\\b(?=\\s*\\()|\\b(\\d+(?:\\.\\d+)?)\\b", 'gi');
function highlightSql(text) {
  var out = '', last = 0, m; SQL_RE.lastIndex = 0;
  while ((m = SQL_RE.exec(text))) {
    out += esc(text.slice(last, m.index));
    var cls = m[1] ? 's' : m[2] ? 'p' : m[3] ? 'k' : m[4] ? 'f' : 'n';
    out += '<span class="tok-' + cls + '">' + esc(m[0]) + '</span>'; last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function sqlEditor(initial) {

  function sync() {
    pre.innerHTML = highlightSql(ta.value) + '\n';
    var n = ta.value.split('\n').length; gut.textContent = Array.from({ length: n + 1 }, function (_, i) { return i + 1; }).join('\n');
    pre.scrollTop = gut.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;

  ta.addEventListener('input', sync);
  ta.addEventListener('scroll', function () { pre.scrollTop = gut.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });

}

  var save = h('button', { class: 'btn', text: 'ذخیره', onclick: async function () {

  var d = drawer(s.id ? 'ویرایش Section' : 'Section جدید', [connList,

/* ---------- صفحه: تنظیمات ---------- */
async function pSettings() {
  await Promise.all([loaders.set(), loaders.meta()]);
  var groups = []; S.set.forEach(function (x) { if (groups.indexOf(x.group) < 0) groups.push(x.group); });
  var current = groups[0], inputs = {}, bar = null;
  var wrap = h('div'), nav = h('div', { class: 'set-nav' }), list = h('div', { class: 'grid' });
  var varsFor = {
    ContextTemplate: ['KnowledgeBase', 'Sections'].concat(S.meta.parameters.map(function (p) { return 'Param.' + p; })),
    UserMessageTemplate: ['Context', 'Question'], KnowledgeItemTemplate: ['Category', 'Question', 'Alternatives', 'Answer'],
    SectionTemplate: ['Title', 'Description', 'Status', 'Data']
  };
  function dirtyKeys() { return S.set.filter(function (x) { return inputs[x.key] && inputs[x.key].value !== x.value; }).map(function (x) { return x.key; }); }
  function updateBar() {
    var n = dirtyKeys().length;
    S.set.forEach(function (x) { var el = inputs[x.key]; if (el) el.closest('.field').classList.toggle('dirty', el.value !== x.value); });
    if (n && !bar) {
      bar = h('div', { class: 'savebar' }, [h('span', { id: 'dirtyN' }), h('button', { class: 'btn sm', text: 'ذخیره تغییرات', onclick: saveAll }),
        h('button', { class: 'btn sm ghost', style: 'color:var(--text)', text: 'لغو', onclick: function () { S.set.forEach(function (x) { inputs[x.key].value = x.value; }); updateBar(); } })]);
      document.body.appendChild(bar);
    }
    if (bar) { if (!n) { bar.remove(); bar = null; } else bar.querySelector('#dirtyN').textContent = fa(n) + ' تغییر ذخیره‌نشده'; }
  }
  async function saveAll() {
    var body = {}; dirtyKeys().forEach(function (k) { body[k] = inputs[k].value; });
    try { await call('settings', 'PUT', body); S.set.forEach(function (x) { if (body[x.key] != null) x.value = body[x.key]; }); toast('تنظیمات ذخیره شد', 'ok'); updateBar(); }
    catch (e) { toast(e.message, 'err'); }
  }
  S.set.forEach(function (it) {
    var input = it.multiline ? h('textarea', { rows: Math.min(14, Math.max(4, it.value.split('\n').length + 1)) }) : h('input');
    input.value = it.value; inputs[it.key] = input; input.addEventListener('input', updateBar);
    var vars = varsFor[it.key];
    it.node = h('div', { class: 'card field' }, [
      h('div', { class: 'top2' }, [h('b', { text: it.description }), h('code', { text: it.key }), h('span', { style: 'flex:1' }),
        h('button', { class: 'btn sm ghost', text: 'پیش‌فرض', onclick: function () { input.value = it.default; updateBar(); } })]),
      vars ? h('div', { class: 'chips', style: 'margin-bottom:8px' }, vars.map(function (v) { return h('span', { class: 'chip btnlike', text: '{{' + v + '}}', onclick: function () { insertAt(input, '{{' + v + '}}'); } }); })) : null,
      input]);
  });
  function modelTestCard() {
    var out = h('div', { style: 'margin-top:10px' });
    var btn = h('button', { class: 'btn soft', html: ico('bolt', 15) + ' تست مدل', onclick: async function () {
      btn.disabled = true; out.replaceChildren(h('div', { class: 'skeleton', style: 'height:50px' }));
      try {
        var r = await call('model/test', 'POST', {});
        out.replaceChildren(h('div', { class: 'row', style: 'flex-wrap:wrap' }, [h('span', { class: 'chip ' + (r.ok ? 'ok' : 'err'), text: r.ok ? 'اتصال موفق' : 'ناموفق' }),
          h('span', { class: 'chip', text: r.model }), h('span', { class: 'chip', text: fa(r.elapsedMs) + ' ms' })]),
          h('div', { class: r.ok ? 'muted' : '', style: 'margin-top:8px;white-space:pre-wrap;' + (r.ok ? '' : 'color:var(--danger)'), text: r.message }));
      } catch (e) { out.replaceChildren(h('div', { class: 'chip err', text: e.message })); }
      btn.disabled = false;
    } });
    return h('div', { class: 'card field' }, [h('div', { class: 'top2' }, [h('b', { text: 'تست اتصال به Ollama' })]),
      h('div', { class: 'hint', text: 'ابتدا تغییرات را ذخیره کنید، سپس تست بزنید. وجود مدل روی سرور Ollama هم بررسی می‌شود.' }), h('div', { style: 'margin-top:10px' }, [btn]), out]);
  }
  function drawGroup() {
    nav.replaceChildren.apply(nav, groups.map(function (g) {
      return h('span', { class: 'chip btnlike' + (g === current ? ' on' : ''), style: 'padding:6px 16px;font-size:13px', text: g, onclick: function () { current = g; drawGroup(); } });
    }));
    var nodes = S.set.filter(function (x) { return x.group === current; }).map(function (x) { return x.node; });
    if (current === 'مدل') nodes.unshift(modelTestCard());
    list.replaceChildren.apply(list, nodes);
  }
  drawGroup(); updateBar();
  wrap.append(nav, list);
  return wrap;
}

/* ---------- صفحه: پیش‌نمایش ---------- */
async function pPreview() {
  await loaders.set();
  var maxChars = parseInt((S.set.find(function (x) { return x.key === 'MaxContextChars'; }) || {}).value || '16000', 10);
  var out = h('pre', { class: 'code big', text: 'برای دیدن Context نهایی (دقیقاً همان چیزی که به مدل می‌رسد) دکمه را بزنید.' });
  var info = h('div', { class: 'card pad', style: 'margin-bottom:16px;display:none' });
  var btn = h('button', { class: 'btn', html: ico('play', 15) + ' ساخت Context برای کاربر جاری', onclick: async function () {
    btn.disabled = true; out.textContent = 'در حال اجرای همه Queryها...';
    try {
      var r = await call('preview', 'POST', {}); out.textContent = r.context;
      var pct = Math.min(100, r.length / maxChars * 100);
      info.style.display = ''; info.replaceChildren(
        h('div', { class: 'row', style: 'margin-bottom:8px' }, [h('b', { text: fa(r.length) + ' کاراکتر' }), h('span', { class: 'muted', text: '≈ ' + fa(Math.round(r.length / 2.7)) + ' توکن (تخمینی)' }),
          h('span', { style: 'flex:1' }), h('span', { class: 'muted', text: 'سقف: ' + fa(maxChars) })]), h('div', { class: 'meter' }, [h('i', { style: 'width:' + pct + '%' })]));
    } catch (e) { out.textContent = e.message; }
    btn.disabled = false;
  } });
  return h('div', {}, [h('div', { class: 'toolbar' }, [btn,
    h('button', { class: 'btn ghost', html: ico('copy', 15) + ' کپی', onclick: function () { navigator.clipboard.writeText(out.textContent).then(function () { toast('کپی شد', 'ok'); }); } })]), info, out]);
}

/* ---------- صفحه: گفتگوها ---------- */
async function pLogs() {
  await loaders.logs();
  var list = h('div', { class: 'card' }), search = h('input', { type: 'search', placeholder: 'جستجو در پرسش، پاسخ و کاربر...' });
  var errOnly = toggle(false);
  function draw() {
    var f = search.value.trim().toLowerCase();
    var rows = S.logs.filter(function (l) { return (!errOnly.input.checked || l.error) && (!f || ((l.question || '') + (l.answer || '') + (l.error || '') + (l.userKey || '')).toLowerCase().indexOf(f) >= 0); });
    list.replaceChildren.apply(list, rows.length ? rows.map(function (l) {
      var row = h('div', { class: 'log' }, [h('div', { class: 'head' }, [
        h('span', { class: 'chip ' + (l.error ? 'err' : 'ok'), text: l.error ? 'خطا' : 'موفق' }), h('span', { class: 'q', text: l.question }),
        h('span', { class: 'chip', text: 'کاربر ' + (l.userKey || '-') }), h('span', { class: 'chip', text: (l.durationMs / 1000).toFixed(1) + ' s' }),
        h('span', { class: 'muted', style: 'font-size:12px', text: fmtDate(l.createdAt) })]),
        h('div', { class: 'detail', text: l.error || l.answer || '' })]);
      row.addEventListener('click', function () { row.classList.toggle('open'); });
      return row;
    }) : [h('div', { class: 'empty', html: ico('log', 40) + '<div>گفتگویی یافت نشد</div>' })]);
  }
  search.addEventListener('input', draw); errOnly.input.addEventListener('change', draw); draw();
  return h('div', {}, [h('div', { class: 'toolbar' }, [h('div', { class: 'search' }, [I('search', 16), search]),
    h('label', { class: 'row' }, [errOnly.node, h('span', { text: 'فقط خطاها' })]),
    h('button', { class: 'btn ghost', onclick: render, text: 'بازآوری' })]), list]);
}

/* ---------- مسیریابی ---------- */
var PAGES = {
  dashboard: { t: 'داشبورد', s: 'نمای کلی سلامت و فعالیت دستیار', i: 'dash', f: pDashboard },
  qa: { t: 'سوال و جواب', s: 'پایگاه دانش ثابتی که در هر پیام به مدل داده می‌شود', i: 'qa', f: pQuestions },
  sec: { t: 'Sectionهای دیتابیس', s: 'Queryهایی که در هر پیام برای کاربر جاری اجرا می‌شوند', i: 'db', f: pSections },
  settings: { t: 'تنظیمات و پیام‌ها', s: 'مدل، System Message، قالب‌ها و پیام‌های رابط کاربری', i: 'cog', f: pSettings },
  preview: { t: 'پیش‌نمایش Context', s: 'دقیقاً همان چیزی که به Ollama ارسال می‌شود', i: 'eye', f: pPreview },
  logs: { t: 'گفتگوها', s: '۲۰۰ گفتگوی اخیر', i: 'log', f: pLogs }
};
var view = document.getElementById('view'), token = 0;
function route() { return (location.hash.replace(/^#\/?/, '') || 'dashboard'); }
async function render() {
  var key = PAGES[route()] ? route() : 'dashboard', p = PAGES[key], my = ++token;
  document.getElementById('pageTitle').textContent = p.t; document.getElementById('pageSub').textContent = p.s; document.title = p.t + ' | دستیار هوشمند';
  document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('active', a.dataset.k === key); });
  document.getElementById('side').classList.remove('open');
  if (!view.firstChild) view.append(h('div', { class: 'skeleton' }), h('div', { class: 'skeleton' }));
  try {
    var node = await p.f(); if (my !== token) return;
    view.replaceChildren(node);
    var cq = document.querySelector('[data-k=qa] .count'); if (cq) cq.textContent = fa(S.q.length || 0);
  } catch (e) { if (my === token) view.replaceChildren(h('div', { class: 'card empty', html: ico('alert', 44) + '<div>' + esc(e.message) + '</div>' })); }
}

/* ---------- راه‌اندازی ---------- */
document.getElementById('logo').innerHTML = ico('bot', 22);
document.getElementById('nav').append.apply(document.getElementById('nav'), Object.keys(PAGES).map(function (k) {
  return h('a', { 'data-k': k, href: '#/' + k, html: ico(PAGES[k].i) + '<span>' + PAGES[k].t + '</span>' + (k === 'qa' ? '<span class="count"></span>' : '') });
}));
document.getElementById('menuBtn').innerHTML = ico('menu');
document.getElementById('menuBtn').onclick = function () { document.getElementById('side').classList.toggle('open'); };
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').innerHTML = ico(t === 'dark' ? 'sun' : 'moon');
  safe(function () { localStorage.setItem('ai-admin-theme', t); });
}
applyTheme(safe(function () { return localStorage.getItem('ai-admin-theme'); }) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
document.getElementById('themeBtn').onclick = function () { applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };
document.getElementById('helpBtn').onclick = function () { toast('/ جستجو  •  N مورد جدید  •  Esc بستن  •  G سپس D/Q/S/T/P/L ناوبری'); };
window.addEventListener('hashchange', render);
var gPressed = false;
document.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === '/') { var s = document.querySelector('.search input'); if (s) { e.preventDefault(); s.focus(); } }
  else if (e.key === 'n' || e.key === 'N') { if (route() === 'qa') editQuestion(); else if (route() === 'sec') editSection(); }
  else if (e.key === 'g') { gPressed = true; setTimeout(function () { gPressed = false; }, 900); }
  else if (gPressed) { var m = { d: 'dashboard', q: 'qa', s: 'sec', t: 'settings', p: 'preview', l: 'logs' }[e.key.toLowerCase()]; if (m) location.hash = '#/' + m; gPressed = false; }
});
render();
})();
